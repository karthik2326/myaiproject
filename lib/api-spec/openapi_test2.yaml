openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: PMFBY Crop Insurance AI Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: farmers
    description: Farmer management
  - name: fields
    description: Agricultural field/land records
  - name: claims
    description: Insurance claim management
  - name: predictions
    description: AI model predictions
  - name: inspections
    description: Field staff inspections and verifications
  - name: anomalies
    description: Fraud/anomaly detection
  - name: weather
    description: Weather event data
  - name: dashboard
    description: Dashboard summary and analytics
  - name: activity
    description: Activity feed and timeline
  - name: datacollection
    description: Field data collection for annotation
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Farmers ─────────────────────────────────────────────────────────────
  /farmers:
    get:
      operationId: listFarmers
      tags: [farmers]
      summary: List all farmers
      parameters:
        - name: district
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: List of farmers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Farmer"
    post:
      operationId: createFarmer
      tags: [farmers]
      summary: Register a new farmer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FarmerInput"
      responses:
        "201":
          description: Farmer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Farmer"

  /farmers/{id}:
    get:
      operationId: getFarmer
      tags: [farmers]
      summary: Get farmer details
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Farmer details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Farmer"
        "404":
          description: Not found
    patch:
      operationId: updateFarmer
      tags: [farmers]
      summary: Update farmer details
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FarmerUpdate"
      responses:
        "200":
          description: Updated farmer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Farmer"

  /farmers/{id}/claims:
    get:
      operationId: getFarmerClaims
      tags: [farmers]
      summary: Get all claims for a farmer
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Claims for farmer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Claim"

  # ─── Fields ──────────────────────────────────────────────────────────────
  /fields:
    get:
      operationId: listFields
      tags: [fields]
      summary: List agricultural fields
      parameters:
        - name: farmerId
          in: query
          schema: { type: integer }
        - name: district
          in: query
          schema: { type: string }
        - name: cropType
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: List of fields
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Field"
    post:
      operationId: createField
      tags: [fields]
      summary: Register a new field
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FieldInput"
      responses:
        "201":
          description: Field created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Field"

  /fields/{id}:
    get:
      operationId: getField
      tags: [fields]
      summary: Get field details
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Field details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Field"
        "404":
          description: Not found

  # ─── Claims ──────────────────────────────────────────────────────────────
  /claims:
    get:
      operationId: listClaims
      tags: [claims]
      summary: List insurance claims
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, under_review, approved, rejected, flagged]
        - name: district
          in: query
          schema: { type: string }
        - name: cropType
          in: query
          schema: { type: string }
        - name: damageType
          in: query
          schema: { type: string }
        - name: fromDate
          in: query
          schema: { type: string, format: "date" }
        - name: toDate
          in: query
          schema: { type: string, format: "date" }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: List of claims
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Claim"
    post:
      operationId: createClaim
      tags: [claims]
      summary: Submit a new insurance claim
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimInput"
      responses:
        "201":
          description: Claim created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Claim"

  /claims/{id}:
    get:
      operationId: getClaim
      tags: [claims]
      summary: Get claim details
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Claim details
          content:
components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
    Farmer:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
    FarmerInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
    FarmerUpdate:
      type: object
      properties:
        name:
          type: string
